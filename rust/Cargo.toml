[package]
name = "chris-oag"
version = "0.0.1"
authors = ["dev@babymri.org"]
description = "OpenAPI models for the ChRIS backend, generated by OpenAPI-generator."
license = "MIT"
edition = "2024"

[dependencies]
serde = { version = "^1.0", features = ["derive"] }
serde_with = { version = "^3.8", default-features = false, features = ["base64", "std", "macros"] }
serde_json = "^1.0"
uuid = { version = "1.17.0", features = ["serde"] }
